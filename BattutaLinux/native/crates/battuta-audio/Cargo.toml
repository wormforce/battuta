[package]
name = "battuta-audio"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "battuta_audio"
crate-type = ["rlib", "cdylib"]

[features]
default = ["pipewire"]
# Links libpipewire-0.3 and enables the realtime output stream. The mixing
# core (ring, voices, bank) builds without it so it stays testable anywhere.
pipewire = []

[dependencies]
libc.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
