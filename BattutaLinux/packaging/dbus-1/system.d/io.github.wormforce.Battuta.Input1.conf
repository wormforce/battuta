<?xml version="1.0"?>
<!-- battuta-inputd system-bus policy (Linux port PR 15). No DOCTYPE on
     purpose: packaging tests parse this file with XDocument.Parse, which
     rejects DTDs, and D-Bus does not require it. -->
<busconfig>
  <!-- The broker claims io.github.wormforce.Battuta.Input1 on the system
       bus so clients can discover it. The packaged service runs as root
       (see the unit: a trusted polkit caller is required for the
       per-connection CheckAuthorization gate); the dedicated account from
       sysusers.d stays allowed for dev/test runs of the same binary. -->
  <policy user="root">
    <allow own="io.github.wormforce.Battuta.Input1"/>
  </policy>
  <policy user="battuta-input">
    <allow own="io.github.wormforce.Battuta.Input1"/>
  </policy>
  <policy context="default">
    <allow send_destination="io.github.wormforce.Battuta.Input1"/>
  </policy>
</busconfig>
