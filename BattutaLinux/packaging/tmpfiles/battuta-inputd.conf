# Runtime directory for the Battuta input broker socket (Linux port PR 10).
# The systemd units declare RuntimeDirectory; this entry covers manual runs.
# Mode 0755 (world-traversable, matching the units) so the desktop user's app
# can reach the socket; the per-connection polkit gate, not filesystem bits,
# is the actual access control.
d /run/battuta-inputd 0755 battuta-input battuta-input - -
